[package]
name = "inlign"
version = "0.1.0"
description = "Live mathematical notepad: draft solutions in plain text and let the notebook compute and check them as you type."
authors = ["benyamin-git"]
license = "MIT"
repository = "https://github.com/benyamin-git/Inlign"
edition = "2024"
rust-version = "1.90"

[lib]
name = "inlign_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
tauri = { version = "2.12.1" }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
