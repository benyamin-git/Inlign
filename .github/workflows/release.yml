name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  web:
    name: Web bundle
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package the web bundle
        run: cd dist && zip -qr ../inlign-web.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: inlign-web.zip
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            artifact: desktop-windows
            bundles: nsis
          - name: macos
            os: macos-latest
            artifact: desktop-macos
            bundles: dmg
          - name: linux
            os: ubuntu-latest
            artifact: desktop-linux
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: npm ci
      - name: Build desktop bundles
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  android:
    name: Android APK
    needs: gates
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
      - name: Install the Android NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "NDK_HOME=$sdk_root/ndk/$NDK_VERSION"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: npm ci
      - name: Generate the Android project
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npm run android:init
          fi
      - name: Build the APK
        run: npm run android:apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [web, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Normalize artifact names
        run: node scripts/collect-artifacts.mjs artifacts dist-release
      - name: Compose the release body
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && index($0, "## ") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            {
              printf '## Inlign %s\n\n' "$GITHUB_REF_NAME"
              printf 'Artifacts:\n\n'
              for file in dist-release/*; do
                printf -- '- `%s`\n' "$(basename "$file")"
              done
            } > release-body.md
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist-release/* \
              --title "Inlign $GITHUB_REF_NAME" \
              --notes-file release-body.md
          fi
