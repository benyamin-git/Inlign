name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Reads the pinned pnpm version from package.json#packageManager.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM engine
        run: pnpm build:wasm

      - name: Check Rust formatting
        run: cargo fmt --check --all

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --workspace

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint TypeScript
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check generated accent tokens
        run: |
          pnpm generate:accents
          git diff --exit-code -- apps/web/src/theme/accents.css

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm --filter @inlign/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Build production PWA
        run: pnpm build
